plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
}

group = 'com.example.finance'
version = System.getenv('APP_VERSION') ?: '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ── CORE SPRING BOOT ──────────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // spring-boot-starter-web: exposes an on-demand job trigger endpoint
    // (BatchJobController) and makes the actuator endpoints above reachable
    // over HTTP. Without a web starter, batch-processor never runs any job
    // outside of an (also disabled by default) nightly/monthly cron.
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // ── DATABASE ──────────────────────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'

    // ── STRUCTURED LOGGING ────────────────────────────────────────────────────
    // logstash-logback-encoder: emits one JSON object per log line.
    // Automatically includes MDC fields in the JSON output.
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // ── TEST ──────────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'com.h2database:h2'   // In-memory DB for unit tests (no Postgres needed)
}

tasks.named('test') {
    useJUnitPlatform()
}
